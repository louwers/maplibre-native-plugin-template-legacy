name: Plugin render tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Shared ${{ matrix.backend }} runner
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend:
          - OpenGL
          - Vulkan
        include:
          - backend: OpenGL
            cmake_flag: MLN_WITH_OPENGL
          - backend: Vulkan
            cmake_flag: MLN_WITH_VULKAN
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned MapLibre revision
        id: native
        run: echo "revision=$(tr -d '\n' < native-revision.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out plugin-enabled MapLibre Native
        uses: actions/checkout@v4
        with:
          repository: maplibre/maplibre-native
          ref: ${{ steps.native.outputs.revision }}
          path: maplibre-native
          submodules: recursive

      - name: Install renderer dependencies
        run: maplibre-native/.github/scripts/install-linux-deps

      - name: Configure ${{ matrix.backend }} runner
        run: |
          cmake \
            -S . \
            -B "build-${{ matrix.backend }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DMAPLIBRE_NATIVE_SOURCE_DIR="$GITHUB_WORKSPACE/maplibre-native" \
            -DMLN_WITH_X11=ON \
            -DMLN_WITH_WAYLAND=OFF \
            -D${{ matrix.cmake_flag }}=ON

      - name: Build ${{ matrix.backend }} runner
        run: cmake --build "build-${{ matrix.backend }}" --target plugin-render-tests

      - name: Run all plugin manifests on ${{ matrix.backend }}
        run: |
          xvfb-run -a \
            "build-${{ matrix.backend }}/plugin-render-tests" \
            --plugin-test-root "$GITHUB_WORKSPACE" \
            --recycle-map

      - name: Upload render-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.backend }}-diagnostics
          path: |
            plugins/*/render-tests/results/manifest.html
            plugins/*/render-tests/**/actual.png
            plugins/*/render-tests/**/diff.png
          if-no-files-found: ignore

  metal:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Shared Metal runner
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned MapLibre revision
        id: native
        run: echo "revision=$(tr -d '\n' < native-revision.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out plugin-enabled MapLibre Native
        uses: actions/checkout@v4
        with:
          repository: maplibre/maplibre-native
          ref: ${{ steps.native.outputs.revision }}
          path: maplibre-native
          submodules: recursive

      - name: Install renderer dependencies
        run: brew install icu4c jpeg-turbo libpng libuv webp ninja

      - name: Configure Metal runner
        run: |
          cmake \
            -S . \
            -B build-Metal \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMAPLIBRE_NATIVE_SOURCE_DIR="$GITHUB_WORKSPACE/maplibre-native" \
            -DMLN_WITH_METAL=ON \
            -DMLN_WITH_OPENGL=OFF

      - name: Build Metal runner
        run: cmake --build build-Metal --target plugin-render-tests

      - name: Run all plugin manifests
        run: |
          build-Metal/plugin-render-tests \
            --plugin-test-root "$GITHUB_WORKSPACE" \
            --recycle-map

      - name: Upload render-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-Metal-diagnostics
          path: |
            plugins/*/render-tests/results/manifest.html
            plugins/*/render-tests/**/actual.png
            plugins/*/render-tests/**/diff.png
          if-no-files-found: ignore
